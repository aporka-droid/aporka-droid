name: Refresh profile statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/profile-stats.mjs'
      - '.github/workflows/profile-stats.yml'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test generator
        run: node scripts/profile-stats.mjs --test
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: aporka-droid
        run: node scripts/profile-stats.mjs
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh profile statistics'
          git pull --rebase origin main
          git push origin HEAD:main
